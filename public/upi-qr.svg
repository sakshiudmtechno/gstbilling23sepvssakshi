    <filter id="cardShadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="520" height="720" fill="#f8fafc" />

  <!-- Main Scanner Card -->

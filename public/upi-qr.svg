    <!-- Center AU Badge -->
    <circle cx="145" cy="145" r="23" fill="#ffffff" />
    <circle cx="145" cy="145" r="20" fill="#e3521b" />
    <text x="145" y="151" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">AU</text>
  </g>

  <!-- Supported Payment Apps Strip -->
  <g transform="translate(75, 500)">
    <!-- Paytm Pill -->
    <g transform="translate(0, 0)">
      <rect width="56" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="28" y="20" font-size="10" font-weight="800" fill="#00b9f5" text-anchor="middle">Paytm</text>
    </g>

    <!-- Google Pay Pill -->
    <g transform="translate(64, 0)">
      <rect width="56" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(16, 6) scale(0.75)">

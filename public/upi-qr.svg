    <rect x="0" y="0" width="52" height="52" rx="26" fill="#fbe8ea" />
    <!-- Orange Terminal / Cards Outline -->
    <rect x="15" y="13" width="22" height="26" rx="4" fill="none" stroke="#e3521b" stroke-width="2.2" />
    <line x1="19" y1="18" x2="27" y2="18" stroke="#e3521b" stroke-width="2" stroke-linecap="round" />
    <line x1="19" y1="23" x2="33" y2="23" stroke="#e3521b" stroke-width="2" stroke-linecap="round" />
    <line x1="19" y1="28" x2="31" y2="28" stroke="#e3521b" stroke-width="2" stroke-linecap="round" />

    <!-- Name and VPA -->
    <text x="66" y="22" font-size="18" font-weight="800" fill="#1e293b" letter-spacing="0.5">BREWSTACK24</text>
    <text x="66" y="44" font-size="15" font-weight="600" fill="#3b3886" text-decoration="underline">brewstack243668@aubiz</text>
